---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image wordt gepubliceerd naar ghcr.io/alekvdw/jarvis-os
name: jarvis-os
description: Bazzite met een eigen JARVIS-thema (opstartscherm, later inlogscherm en bureaubladschil) en de JARVIS-widgets erbovenop.

# vertrekt van Bazzite (KDE-variant) i.p.v. gewone Fedora Silverblue — zie
# fizzy-floating-robin.md voor waarom: kant-en-klare Proton/game-compatibiliteit,
# atomic/veilig, en meetbaar lichter dan Windows (gemeten: 1,8GB in rust).
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  # kopieert files/system/* naar de root van de image (/) — hier dus het
  # JARVIS-opstartscherm naar /usr/share/plymouth/themes/jarvis-theme
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        # nodig om .script-opstartschermthema's te kunnen draaien — staat niet
        # standaard op Bazzite (enkel de eenvoudige two-step/spinner-plugins wel)
        - plymouth-plugin-script

  - type: script
    snippets:
      # het JARVIS-opstartscherm instellen als standaard + initramfs herbouwen
      - plymouth-set-default-theme -R jarvis-theme

  # zet de ondertekening (cosign) op — nodig zodat bootc/rpm-ostree de image kan
  # verifiëren bij het rebasen; hoort bij elk BlueBuild-recept, niet aankomen.
  - type: signing
